server:
  port: 8080

spring:
  application:
    name: gateway-service

  cloud:
    gateway:
      routes:
        - id: user-service
          uri: http://localhost:8081
          predicates:
            - Path=/users/**, /auth/**

        - id: product-service
          uri: http://localhost:8082
          predicates:
            - Path=/products/**

        - id: cart-service
          uri: http://localhost:8083
          predicates:
            - Path=/cart/**
jwt:
  secret: 1234567890abcdef1234567890abcdef